<!DOCTYPE html>

<head>
  <meta charset="utf-8">

  <script>
    var _paq = window._paq = window._paq || [];
    /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
    _paq.push(['trackPageView']);
    _paq.push(['enableLinkTracking']);
    (function() {
      var u="//cedelogger.epfl.ch/";
      _paq.push(['setTrackerUrl', u+'matomo.php']);
      _paq.push(['setSiteId', '2']);
      var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
      g.async=true; g.src=u+'matomo.js'; s.parentNode.insertBefore(g,s);
    })();
  </script>

  <style>

    .gray-color{
      color: #adb5bd;
    }

    .language_button{
      font-weight: bold;
      border: none;
      min-width: 45px !important;
      min-height: 50px !important;
      background: none;
      transition: text-decoration-color 0.2s ease-in-out, color 0.2s ease-in-out, -webkit-text-decoration-color 0.2s ease-in-out;
    }
    .language_button:hover{
      color: #0a0c0d;
      transition: 0.7s;
    }
    .tableExercises{
      padding: 0 30px 10px 0;

    }
    .tableExercises:after{
      content: none!important;
    }
    .tableExercisesText{
      color: #212121;
      font-size: 17px;
    }
    .list-unstyled a:before{
      background: none !important;
    }
    .nav-aside a{
      padding: 0.3rem 3rem;
    }
    ul.list-unstyled li div{
      padding: 0.3rem 3rem;
    }
    #nav-aside  form  ul{
      padding-left: 0;
    }
    #nav-aside form ul li div{
      padding-left: 4.5rem;
    }
    .title_filters{
      padding-left: 3rem !important;
      color: #B51F1F;
      font-weight: bold;
      font-size: large;
    }
    .list-unstyled{
      padding-bottom: 15px;
    }
    .links_footer{
      text-decoration: none
    }
    .centered-block img{
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .center-block {
      text-align: center;
    }
    .mobile-menu-open .header{
      overflow: visible;
    }
    .nav-lang-short ul li + li::before{
      top:1.1rem;
    }
    .breadcrumb-item:not(.breadcrumb-tags-wrapper){
      display: inline-block;
    }
    .oval{
  height: 25px;
  width: 32px;
  background-color: #B51F1F;
  border-radius: 42%;
  color: #FFFFFF;
      display: inline-block;
}
    .skip a
{
position:absolute;
left:-10000px;
top:auto;
width:1px;
height:1px;
overflow:hidden;
}

.skip a:focus
{
position:static;
width:auto;
height:auto;
}
.visually-hidden {
    border: 0;
    padding: 0;
    margin: 0;
    position: absolute !important;
    height: 1px;
    width: 1px;
    overflow: hidden;
    clip: rect(1px 1px 1px 1px); /* IE6, IE7 - a 0 height clip, off to the bottom right of the visible 1px box */
    clip: rect(1px, 1px, 1px, 1px); /*maybe deprecated but we need to support legacy browsers */
    clip-path: inset(50%); /*modern browsers, clip-path works inwards from each corner*/
    white-space: nowrap; /* added line to stop words getting smushed together (as they go onto seperate lines and some screen readers do not understand line feeds as a space */
}
#statement_html{
  display: block;
}
#solution_html{
  display: none;
}

.file-box {
  float: left;
  width: 220px;
}
.file-manager h5 {
  text-transform: uppercase;
}
.file-manager {
  list-style: none outside none;
  margin: 0;
  padding: 0;
}
.folder-list li a {
  color: #666666;
  display: block;
  padding: 5px 0;
}
.folder-list li {
  border-bottom: 1px solid #e7eaec;
  display: block;
}
.folder-list li i {
  margin-right: 8px;
  color: #3d4d5d;
}
.category-list li a {
  color: #666666;
  display: block;
  padding: 5px 0;
}
.category-list li {
  display: block;
}
.category-list li i {
  margin-right: 8px;
  color: #3d4d5d;
}
.category-list li a .text-navy {
  color: #1ab394;
}
.category-list li a .text-primary {
  color: #1c84c6;
}
.category-list li a .text-info {
  color: #23c6c8;
}
.category-list li a .text-danger {
  color: #EF5352;
}
.category-list li a .text-warning {
  color: #F8AC59;
}
.file-manager h5.tag-title {
  margin-top: 20px;
}
.tag-list li {
  float: left;
}
.tag-list li a {
  font-size: 10px;
  background-color: #f3f3f4;
  padding: 5px 12px;
  color: inherit;
  border-radius: 2px;
  border: 1px solid #e7eaec;
  margin-right: 5px;
  margin-top: 5px;
  display: block;
}
.file {
  border: 1px solid #e7eaec;
  padding: 0;
  background-color: #ffffff;
  position: relative;
  margin-bottom: 20px;
  margin-right: 20px;
}
.file-manager .hr-line-dashed {
  margin: 15px 0;
}
.file .icon,
.file .image {
  height: 100px;
  overflow: hidden;
}
.file .icon {
  padding: 15px 10px;
  text-align: center;
}

.file .icon i {
  font-size: 70px;
  color: #dadada;
}
.file .file-name {
  padding: 10px;
  background-color: #f8f8f8;
  border-top: 1px solid #e7eaec;
}
.file-name small {
  color: #676a6c;
}
ul.tag-list li {
  list-style: none;
}


.ibox {
  clear: both;
  margin-bottom: 25px;
  margin-top: 0;
  padding: 0;
}
.ibox.collapsed .ibox-content {
  display: none;
}
.ibox.collapsed .fa.fa-chevron-up:before {
  content: "\f078";
}
.ibox.collapsed .fa.fa-chevron-down:before {
  content: "\f077";
}
.ibox:after,
.ibox:before {
  display: table;
}

.ibox-content {
  background-color: #ffffff;
  color: inherit;
  padding: 15px 20px 20px 20px;
  border-color: #e7eaec;
  border-image: none;
  border-style: solid solid none;
  border-width: 1px 0;
}
a:hover{
text-decoration:none;
}
</style>

{% block extra_head %}
{% endblock %}
</head>
<body data-spy="scroll" data-target="#intermediate-nav" data-offset="0">

{% block content %}
{% endblock %}


</body>
</html>
